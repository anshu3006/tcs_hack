<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-powered API Documentation Generator — paste your API code and get instant, structured documentation with quality analysis.">
  <title>DocForge AI — API Documentation Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#logo-grad)" stroke-width="2.5"/>
            <path d="M8 10h12M8 14h8M8 18h10" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">DocForge<span class="logo-ai">AI</span></span>
      </div>
    </div>
    <div class="header-center">
      <p class="tagline">AI-Powered API Documentation Generator</p>
    </div>
    <div class="header-right">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Left Panel: Input -->
    <section class="panel panel-input">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          API Code Input
        </h2>
        <div class="panel-actions">
          <select id="languageSelect" class="select-lang">
            <option value="auto">Auto-detect</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="java">Java</option>
            <option value="go">Go</option>
            <option value="json">JSON/OpenAPI</option>
            <option value="yaml">YAML</option>
          </select>
        </div>
      </div>

      <!-- Input Tabs -->
      <div class="input-tabs">
        <button class="tab-btn active" data-tab="paste" id="tabPaste">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          Paste Code
        </button>
        <button class="tab-btn" data-tab="upload" id="tabUpload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload File
        </button>
        <button class="tab-btn" data-tab="samples" id="tabSamples">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          Samples
        </button>
      </div>

      <!-- Paste Tab -->
      <div class="tab-content active" id="contentPaste">
        <div class="editor-wrapper">
          <div class="editor-line-numbers" id="lineNumbers"></div>
          <textarea
            id="codeInput"
            class="code-editor"
            placeholder="Paste your API code here...

Examples:
  • Flask/FastAPI Python routes
  • Express.js endpoints
  • Spring Boot controllers
  • OpenAPI/Swagger JSON
  • Any REST API definitions"
            spellcheck="false"
          ></textarea>
        </div>
      </div>

      <!-- Upload Tab -->
      <div class="tab-content" id="contentUpload">
        <div class="upload-zone" id="uploadZone">
          <div class="upload-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#upload-grad)" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
              <defs>
                <linearGradient id="upload-grad" x1="0" y1="0" x2="24" y2="24">
                  <stop stop-color="#6366f1"/>
                  <stop offset="1" stop-color="#a855f7"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <p class="upload-text">Drop your API file here or <span class="upload-browse">browse</span></p>
          <p class="upload-hint">.py  .js  .ts  .java  .go  .json  .yaml</p>
          <input type="file" id="fileInput" accept=".py,.js,.ts,.java,.go,.json,.yaml,.yml,.rb,.php" hidden>
        </div>
        <div class="file-info hidden" id="fileInfo">
          <div class="file-chip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="fileName"></span>
            <button class="file-remove" id="removeFile">×</button>
          </div>
        </div>
      </div>

      <!-- Samples Tab -->
      <div class="tab-content" id="contentSamples">
        <div class="samples-grid">
          <button class="sample-card" data-sample="flask">
            <span class="sample-icon">🐍</span>
            <span class="sample-name">Flask API</span>
            <span class="sample-desc">User CRUD endpoints</span>
          </button>
          <button class="sample-card" data-sample="express">
            <span class="sample-icon">🟢</span>
            <span class="sample-name">Express.js</span>
            <span class="sample-desc">REST API with auth</span>
          </button>
          <button class="sample-card" data-sample="fastapi">
            <span class="sample-icon">⚡</span>
            <span class="sample-name">FastAPI</span>
            <span class="sample-desc">Async endpoints</span>
          </button>
          <button class="sample-card" data-sample="openapi">
            <span class="sample-icon">📋</span>
            <span class="sample-name">OpenAPI JSON</span>
            <span class="sample-desc">Swagger definition</span>
          </button>
          <button class="sample-card" data-sample="spring">
            <span class="sample-icon">☕</span>
            <span class="sample-name">Spring Boot</span>
            <span class="sample-desc">REST Controller</span>
          </button>
          <button class="sample-card" data-sample="go">
            <span class="sample-icon">🔵</span>
            <span class="sample-name">Go / Gin</span>
            <span class="sample-desc">HTTP handlers</span>
          </button>
        </div>
      </div>

      <!-- Generate Button -->
      <div class="generate-bar">
        <button class="btn-generate" id="generateBtn">
          <span class="btn-text">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg>
            Generate Documentation
          </span>
          <span class="btn-loading hidden">
            <div class="spinner"></div>
            Generating...
          </span>
        </button>
      </div>
    </section>

    <!-- Right Panel: Output -->
    <section class="panel panel-output">
      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="50" stroke="url(#empty-grad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.3"/>
            <rect x="35" y="30" width="50" height="60" rx="8" stroke="url(#empty-grad)" stroke-width="2" opacity="0.5"/>
            <line x1="45" y1="45" x2="75" y2="45" stroke="url(#empty-grad)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
            <line x1="45" y1="55" x2="65" y2="55" stroke="url(#empty-grad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
            <line x1="45" y1="65" x2="70" y2="65" stroke="url(#empty-grad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
            <line x1="45" y1="75" x2="60" y2="75" stroke="url(#empty-grad)" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
            <defs>
              <linearGradient id="empty-grad" x1="0" y1="0" x2="120" y2="120">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h3 class="empty-title">Your documentation will appear here</h3>
        <p class="empty-desc">Paste API code or upload a file, then click Generate</p>
      </div>

      <!-- Results -->
      <div class="results hidden" id="results">
        <!-- Quality Banner -->
        <div class="quality-banner" id="qualityBanner">
          <div class="quality-ring-wrapper">
            <svg class="quality-ring" width="80" height="80" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
              <circle cx="40" cy="40" r="34" fill="none" stroke="url(#ring-grad)" stroke-width="6"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"
                id="qualityRingCircle" transform="rotate(-90 40 40)"/>
              <defs>
                <linearGradient id="ring-grad" x1="0" y1="0" x2="80" y2="80">
                  <stop stop-color="#34d399"/>
                  <stop offset="1" stop-color="#6366f1"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="quality-score" id="qualityScore">0%</div>
          </div>
          <div class="quality-info">
            <div class="quality-grade-row">
              <span class="quality-label">Documentation Quality</span>
              <span class="quality-grade" id="qualityGrade">—</span>
            </div>
            <p class="quality-summary" id="qualitySummary"></p>
            <div class="quality-meta">
              <span class="quality-meta-item" id="endpointCount">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                0 endpoints
              </span>
              <span class="quality-meta-item" id="generatedAt">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                —
              </span>
            </div>
          </div>
          <button class="quality-expand-btn" id="qualityExpandBtn" title="Show quality details">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

        <!-- Quality Details (collapsible) -->
        <div class="quality-details hidden" id="qualityDetails">
          <div class="quality-checks" id="qualityChecks"></div>
          <div class="quality-suggestions" id="qualitySuggestions"></div>
        </div>

        <!-- Documentation Output -->
        <div class="docs-output" id="docsOutput"></div>
      </div>
    </section>
  </main>

  <!-- Toast notification -->
  <div class="toast hidden" id="toast">
    <span class="toast-icon"></span>
    <span class="toast-message"></span>
  </div>

  <script src="samples.js"></script>
  <script src="script.js"></script>
</body>
</html>
